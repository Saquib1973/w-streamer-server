# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: w-streamer-server
    runtime: node
    plan: free
    region: singapore # closest Render region to the Supabase project (Tokyo)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1" # Render's load balancer — needed for correct client IPs / rate limits
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: "*"
      # PUBLIC_BASE_URL is filled from Render's RENDER_EXTERNAL_URL automatically.

      # ── Secrets you paste in (Supabase pooler URLs, password URL-encoded) ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ── Generated by Render on first deploy (random base64 256-bit values) ──
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STREAM_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true # copy it from the dashboard for the app's Setup screen
      - key: VAULT_KEY_V1
        generateValue: true # 32 random bytes, base64 — never change it once keys are saved
      - key: VAULT_ACTIVE_KEY_VERSION
        value: "1"

      # ── Torrent engine (free plan: 512 MB RAM, ephemeral disk) ──
      - key: TORRENT_CACHE_DIR
        value: /tmp/torrent-cache
      - key: TORRENT_MAX_ACTIVE
        value: "2"
      - key: TORRENT_MAX_CONNS
        value: "50"
