# Keeps the Render free instance from sleeping (it spins down after ~15 min idle,
# and the next request then takes 20-60 s). Pings the API every 10 minutes.
# GitHub may run scheduled jobs a few minutes late; 10 min leaves headroom.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keep-awake.yml"]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://w-streamer-server.onrender.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Server did not answer with 200"
          exit 1
